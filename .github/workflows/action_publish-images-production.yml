name: Publish PHP 8.3 FPM Nginx

on:
  push:
    branches: [chainguard-php]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-php-${{ github.ref }}
  cancel-in-progress: false

# Edit these values and push to chainguard-php to rebuild this variant.
env:
  IMAGE_NAME: ghcr.io/callabledev/docker-php
  IMAGE_TAG: 8.3.35-chainguard-r4-fpm-nginx-v3.6.1
  IMAGE_MINOR_TAG: 8.3-chainguard-fpm-nginx-v3.6.1
  PLATFORM: linux/amd64
  PHP_VERSION: 8.3.35
  BASE_OS_VERSION: trixie
  NGINX_VERSION: 1.28.0-1~trixie
  # BuildKit fetches this Git ref with submodules to avoid PECL download outages.
  REDIS_SOURCE_REF: 6.2.0
  RAPHF_SOURCE_REF: v2.0.2
  HTTP_SOURCE_REF: v4.3.1
  CHAINGUARD_PHP_PACKAGE_VERSION: 8.3.35-r4
  CHAINGUARD_PHP_IMAGE: cgr.dev/hotsnr.com/php:8.3@sha256:c122eb125b3836f31a8aa32b228f6147694387d60bf8910f87884ca75c9b122e
  CHAINGUARD_FPM_IMAGE: cgr.dev/hotsnr.com/php:8.3-fpm@sha256:123f30505ef2b7f7777ff3f0dfc886faf3f46b9267c11b20bd2b2f5ffc6f34b2
  CHAINGUARD_DEV_IMAGE: cgr.dev/hotsnr.com/php:8.3-dev@sha256:ee43a43ca120f53289796a7eea4b53a023993fb5b6cba7be86546df66cac2135
  REPOSITORY_BUILD_VERSION: v3.6.1-callabledev

jobs:
  publish:
    if: github.ref == 'refs/heads/chainguard-php'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Chainguard
        uses: docker/login-action@v3
        with:
          registry: cgr.dev
          username: ${{ secrets.CHAINGUARD_USERNAME }}
          password: ${{ secrets.CHAINGUARD_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/variations/fpm-nginx/Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            BASE_OS_VERSION=${{ env.BASE_OS_VERSION }}
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            REDIS_SOURCE_REF=${{ env.REDIS_SOURCE_REF }}
            RAPHF_SOURCE_REF=${{ env.RAPHF_SOURCE_REF }}
            HTTP_SOURCE_REF=${{ env.HTTP_SOURCE_REF }}
            CHAINGUARD_PHP_PACKAGE_VERSION=${{ env.CHAINGUARD_PHP_PACKAGE_VERSION }}
            CHAINGUARD_PHP_IMAGE=${{ env.CHAINGUARD_PHP_IMAGE }}
            CHAINGUARD_FPM_IMAGE=${{ env.CHAINGUARD_FPM_IMAGE }}
            CHAINGUARD_DEV_IMAGE=${{ env.CHAINGUARD_DEV_IMAGE }}
            REPOSITORY_BUILD_VERSION=${{ env.REPOSITORY_BUILD_VERSION }}-${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_MINOR_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_MINOR_TAG"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
