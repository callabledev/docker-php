name: Publish PHP 8.3 FPM Nginx

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-php-${{ github.ref }}
  cancel-in-progress: false

# Edit these values and push to prod to rebuild the base image.
env:
  IMAGE_NAME: ghcr.io/callabledev/docker-php
  IMAGE_TAG: 8.3-fpm-nginx-v3.6.1
  PLATFORM: linux/amd64
  PHP_VERSION: 8.3.25
  BASE_OS_VERSION: trixie
  NGINX_VERSION: 1.28.0-1~trixie
  # BuildKit fetches this Git ref with submodules to avoid PECL download outages.
  REDIS_SOURCE_REF: 6.2.0
  PHP_EXTENSIONS: opcache pcntl pdo_mysql pdo_pgsql /usr/src/redis zip
  REPOSITORY_BUILD_VERSION: v3.6.1-callabledev

jobs:
  publish:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/variations/fpm-nginx/Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            BASE_OS_VERSION=${{ env.BASE_OS_VERSION }}
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            REDIS_SOURCE_REF=${{ env.REDIS_SOURCE_REF }}
            DEPENDENCY_PHP_EXTENSIONS=${{ env.PHP_EXTENSIONS }}
            REPOSITORY_BUILD_VERSION=${{ env.REPOSITORY_BUILD_VERSION }}-${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        shell: bash
        run: |
          image="$IMAGE_NAME:$IMAGE_TAG"
          docker run --rm --entrypoint php "$image" -r '
            foreach (["Zend OPcache", "pcntl", "pdo_mysql", "pdo_pgsql", "redis", "zip"] as $extension) {
              if (!extension_loaded($extension)) {
                fwrite(STDERR, "Missing PHP extension: $extension\n");
                exit(1);
              }
            }
          '
          container=$(docker run --detach "$image")
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          for _ in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy ]; then
              docker exec "$container" nginx -t
              docker exec "$container" php-fpm -t
              docker exec "$container" curl --fail --silent --show-error http://localhost:8080/healthcheck
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 60 seconds' >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
